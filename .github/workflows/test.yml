name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

# Keep only the newest test run for a branch when several commits arrive close
# together; stale queued runs do not provide additional release confidence.
concurrency:
  group: ibd-companion-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
